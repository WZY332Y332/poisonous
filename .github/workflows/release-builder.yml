name: Build UWP (x64)

# 相对上游 2022 年的 release-builder.yml，这里做了几处必要现代化：
#  - checkout@v2 -> v4（v2 依赖已下线的 Node12）
#  - 移除 release-drafter / upload-release-asset@v1（已废弃，且在 fork 上缺权限）
#  - 改用 upload-artifact@v4，产物直接下载，不依赖 Release
#  - 只构建 x64（本机与目标设备都是 x64，构建时间从三份降到一份）
#  - 增加 push 触发，推送即编译；同时保留手动 dispatch 可指定版本号

on:
  workflow_dispatch:
    inputs:
      version:
        description: '四段式版本号，例如 2.2310.1.1'
        required: false
        default: '2.2310.3.1'
  push:
    branches: [ main ]
    # 纯文档提交不触发构建，避免无谓消耗
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write

jobs:
  build:
    # 必须钉在 windows-2022：windows-latest 已是 VS 18 镜像，
    # 其中不含 UWP 所需的 Windows.winmd / Windows SDK 22000，会报几百个 Windows.* 命名空间缺失。
    runs-on: windows-2022
    env:
      Solution_Path: .\Bili.Uwp.sln
      UWP_Project_Directory: src\App
      BUILD_VERSION: ${{ github.event.inputs.version || '2.2310.3.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show available Windows SDKs
        shell: pwsh
        run: |
          $out = @()
          $out += "=== Windows Kits\10\Include (已安装 SDK) ==="
          $out += Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          $out += "=== Platforms\UAP ==="
          $out += Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          $out += "=== Windows.winmd ==="
          $out += Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\UnionMetadata" -Filter Windows.winmd -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          $out += "=== MSBuild 版本 ==="
          $out += (msbuild -version 2>&1 | Select-Object -Last 1)
          $out | ForEach-Object { Write-Host $_ }
          $out | Set-Content -Path C:\sdk-info.txt -Encoding UTF8

      - name: Update manifest version
        shell: pwsh
        run: |
          $path = ".\$env:UWP_Project_Directory\Package.appxmanifest"
          [xml]$manifest = Get-Content $path
          $manifest.Package.Identity.Version = $env:BUILD_VERSION
          $manifest.Save((Resolve-Path $path))
          Write-Host "manifest version = $env:BUILD_VERSION"

      - name: Build x64
        # 关闭构建期签名：仓库自带的 App_TemporaryKey.pfx 已于 2024-09-23 过期，
        # msbuild 走到 SignTool 会失败；产物我们会在本地用 wzy332.pfx 重新签名。
        # 用参数数组而非行内字符串：Windows runner 默认 shell 是 pwsh，
        # 参数里出现 ; 会被当成语句分隔符，导致 msbuild 成功但步骤返回非零。
        shell: pwsh
        run: |
          $msbuildArgs = @(
            $env:Solution_Path,
            '/p:Platform=x64',
            '/p:AppxBundlePlatforms=x64',
            '/p:AppxPackageDir=C:\Package\x64',
            '/p:AppxPackageSigningEnabled=false',
            '/restore',
            '/v:normal',
            '/flp:LogFile=C:\build.log'
          )
          Write-Host "msbuild $($msbuildArgs -join ' ')"
          msbuild @msbuildArgs
          Write-Host "===== msbuild exit code: $LASTEXITCODE ====="
          exit $LASTEXITCODE
        env:
          BuildMode: SideloadOnly
          Configuration: Release

      - name: Publish build log
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          files: |
            C:\build.log
            C:\sdk-info.txt
          fail_on_unmatched_files: false
          draft: false
          prerelease: true

      - name: Upload msixbundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: msixbundle-x64
          path: C:\Package\x64\**\*.msixbundle
          if-no-files-found: error
          retention-days: 14

      - name: Publish msixbundle
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          files: C:\Package\x64\**\*.msixbundle
          fail_on_unmatched_files: false
          draft: false
          prerelease: true
